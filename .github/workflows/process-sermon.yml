name: Process Sermon

# Trigger manually from the GitHub website or GitHub mobile app:
# Actions tab -> Process Sermon -> Run workflow -> fill in the fields
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "URL of the finished, edited YouTube clip (for reference)"
        required: true
      title:
        description: "Sermon title"
        required: true
      speaker:
        description: "Speaker name"
        required: true
      sermon_date:
        description: "Sunday date, YYYY-MM-DD"
        required: true
      source_file:
        description: "R2 key of manually-uploaded video (e.g. raw-uploads/sermon.mp4). Leave blank to use yt-dlp instead."
        required: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # transcription can take a while on a free runner
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Deno (JS runtime required by yt-dlp)
        if: github.event.inputs.source_file == ''
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Restore YouTube cookies
        if: github.event.inputs.source_file == ''
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube_cookies.txt
            echo "Cookies file written."
          else
            echo "No YOUTUBE_COOKIES secret set — downloads may be blocked by YouTube's bot detection."
          fi

      - name: Run pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHISPER_MODEL_SIZE: small
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PODCAST_TITLE: ${{ secrets.PODCAST_TITLE }}
          PODCAST_AUTHOR: ${{ secrets.PODCAST_AUTHOR }}
          PODCAST_DESCRIPTION: ${{ secrets.PODCAST_DESCRIPTION }}
          PODCAST_IMAGE_URL: ${{ secrets.PODCAST_IMAGE_URL }}
          PODCAST_LANGUAGE: en-au
          PODCAST_CATEGORY: "Religion & Spirituality"
          PODCAST_EXPLICIT: "false"
          PODCAST_WEBSITE: ${{ secrets.PODCAST_WEBSITE }}
        run: |
          set +e
          python pipeline.py "${{ github.event.inputs.youtube_url }}" \
            --title "${{ github.event.inputs.title }}" \
            --speaker "${{ github.event.inputs.speaker }}" \
            --sermon-date "${{ github.event.inputs.sermon_date }}" \
            --source-file "${{ github.event.inputs.source_file }}" 2>&1 | tee pipeline_debug.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Commit debug log
        if: always()
        run: |
          git config user.name "sermon-pipeline-bot"
          git config user.email "actions@github.com"
          git add pipeline_debug.log
          git diff --staged --quiet && exit 0
          git commit -m "Debug log from run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (probably a concurrent run) — retrying ($i/5)..."
            git pull --rebase
          done
          echo "Failed to push debug log after retries — continuing anyway, this is non-fatal."

      # Fires on ANY failure above, even if pipeline.py never got to run at
      # all (e.g. a dependency install failure) — so a broken run is never
      # silent. This is a separate step/script rather than relying on
      # pipeline.py to report its own failure, since it needs to work even
      # when pipeline.py itself is the thing that's broken.
      - name: Send failure alert
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERMON_TITLE: ${{ github.event.inputs.title }}
          SERMON_SPEAKER: ${{ github.event.inputs.speaker }}
          SERMON_DATE: ${{ github.event.inputs.sermon_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python send_failure_alert.py

      - name: Commit run history (failure)
        if: failure()
        run: |
          git config user.name "sermon-pipeline-bot"
          git config user.email "actions@github.com"
          git add run_history.json
          git diff --staged --quiet && exit 0
          git commit -m "Record failed run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase
          done

      # feed_items.json and run_history.json need to persist between runs so
      # the RSS feed and status page keep accumulating rather than resetting
      # each time. Retries with rebase in case another run's commit landed
      # first (e.g. two form submissions close together, or a form
      # submission overlapping a manually-triggered run) — without this, the
      # losing run's episode would silently vanish from the feed despite the
      # email already confirming success.
      - name: Commit updated episode log
        if: success()
        run: |
          git config user.name "sermon-pipeline-bot"
          git config user.email "actions@github.com"
          git add feed_items.json run_history.json
          git diff --staged --quiet && exit 0
          git commit -m "Add episode: ${{ github.event.inputs.title }}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (probably a concurrent run) — retrying ($i/5)..."
            git pull --rebase
          done
          echo "::error::Failed to push feed_items.json after retries — this episode's data may not be reflected in the feed. Manual check needed."
          exit 1
