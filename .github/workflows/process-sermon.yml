name: Process Sermon

# Trigger manually from the GitHub website or GitHub mobile app:
# Actions tab -> Process Sermon -> Run workflow -> fill in the fields
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "URL of the finished, edited YouTube clip"
        required: true
      title:
        description: "Sermon title"
        required: true
      speaker:
        description: "Speaker name"
        required: true
      sermon_date:
        description: "Sunday date, YYYY-MM-DD"
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # transcription can take a while on a free runner
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHISPER_MODEL_SIZE: small
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PODCAST_TITLE: ${{ secrets.PODCAST_TITLE }}
          PODCAST_AUTHOR: ${{ secrets.PODCAST_AUTHOR }}
          PODCAST_DESCRIPTION: ${{ secrets.PODCAST_DESCRIPTION }}
          PODCAST_IMAGE_URL: ${{ secrets.PODCAST_IMAGE_URL }}
          PODCAST_LANGUAGE: en-au
          PODCAST_CATEGORY: "Religion & Spirituality"
          PODCAST_EXPLICIT: "false"
          PODCAST_WEBSITE: ${{ secrets.PODCAST_WEBSITE }}
        run: |
          set +e
          python pipeline.py "${{ github.event.inputs.youtube_url }}" \
            --title "${{ github.event.inputs.title }}" \
            --speaker "${{ github.event.inputs.speaker }}" \
            --sermon-date "${{ github.event.inputs.sermon_date }}" 2>&1 | tee pipeline_debug.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Commit debug log
        if: always()
        run: |
          git config user.name "sermon-pipeline-bot"
          git config user.email "actions@github.com"
          git add pipeline_debug.log
          git diff --staged --quiet || git commit -m "Debug log from run ${{ github.run_id }}"
          git push

      # feed_items.json needs to persist between runs so the RSS feed keeps
      # accumulating episodes rather than resetting each time
      - name: Commit updated episode log
        if: success()
        run: |
          git config user.name "sermon-pipeline-bot"
          git config user.email "actions@github.com"
          git add feed_items.json
          git diff --staged --quiet || git commit -m "Add episode: ${{ github.event.inputs.title }}"
          git push
