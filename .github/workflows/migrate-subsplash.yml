name: Migrate Subsplash Feed

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only process first N episodes (leave blank for all)"
        required: false
      dry_run:
        description: "Preview only, no uploads (true/false)"
        required: false
        default: "false"
      fix_blurbs:
        description: "Repair garbled text in already-migrated blurbs only (true/false)"
        required: false
        default: "false"

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 requests feedgen ftfy

      - name: Run migration
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: harvestchurch-sermons
          R2_PUBLIC_BASE_URL: https://hrvstpdcst.com
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.fix_blurbs }}" = "true" ]; then
            ARGS="$ARGS --fix-existing-blurbs"
          fi
          python migrate_subsplash_feed.py $ARGS

      - name: Commit updated feed_items.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_items.json
          git diff --staged --quiet || git commit -m "Migrate Subsplash episodes into feed_items.json"
          git push
