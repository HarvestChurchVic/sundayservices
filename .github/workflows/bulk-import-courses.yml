name: Bulk Import Courses to Planning Center

# Completely separate from the sermon pipeline — never touches feed_items.json,
# R2, or the podcast feed. Defaults to a dry run; check "Actually create
# episodes" to run for real.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Actually create episodes? (unchecked = dry run, just shows what would happen)"
        type: boolean
        default: false
      only_files:
        description: "Comma-separated filenames to process (blank = all three). E.g. LEAD_Playlist.xlsx"
        required: false
      published_date:
        description: "Fixed date (YYYY-MM-DD) for availability, or blank for Planning Center's default"
        required: false
      topic_dates:
        description: "Per-topic dates as 'N:YYYY-MM-DD,N:YYYY-MM-DD,...' (overrides published_date for matching rows)"
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Run import
        env:
          PCO_CLIENT_ID: ${{ secrets.PCO_CLIENT_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            ARGS="$ARGS --live"
          fi
          if [ -n "${{ github.event.inputs.only_files }}" ]; then
            ARGS="$ARGS --only-files \"${{ github.event.inputs.only_files }}\""
          fi
          if [ -n "${{ github.event.inputs.published_date }}" ]; then
            ARGS="$ARGS --published-date ${{ github.event.inputs.published_date }}"
          fi
          if [ -n "${{ github.event.inputs.topic_dates }}" ]; then
            ARGS="$ARGS --topic-dates \"${{ github.event.inputs.topic_dates }}\""
          fi
          eval python bulk_import_courses.py $ARGS

      - name: Commit results log
        if: always()
        run: |
          git config user.name "sermon-pipeline-bot"
          git config user.email "actions@github.com"
          git add course_import_results.json
          git diff --staged --quiet && exit 0
          git commit -m "Course import results"
          git push
