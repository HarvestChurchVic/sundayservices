name: Find Missing Episodes

on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Scan playlist for gaps
        run: python find_missing_episodes.py

      - name: Commit report
        if: always()
        run: |
          git config user.name "sermon-pipeline-bot"
          git config user.email "actions@github.com"
          git add missing_episodes_report.json ytdlp_debug.log
          git diff --staged --quiet && exit 0
          git commit -m "Missing episodes report"
          git push
