name: Generate Missing Blurbs

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many episodes to process this run"
        required: false
        default: "8"
      model:
        description: "Whisper model size: tiny/base/small/medium"
        required: false
        default: "small"
      dry_run:
        description: "Preview only, no processing (true/false)"
        required: false
        default: "false"

concurrency:
  group: generate-blurbs
  cancel-in-progress: false

jobs:
  generate-blurbs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install faster-whisper anthropic requests boto3 feedgen ftfy

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-model-${{ github.event.inputs.model }}

      - name: Generate blurbs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--batch-size ${{ github.event.inputs.batch_size }} --model ${{ github.event.inputs.model }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python generate_missing_blurbs.py $ARGS

      - name: Commit new blurbs locally
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git add feed_items.json blurb_progress.log
          git diff --staged --quiet || git commit -m "Generate blurbs for a batch of episodes"

      - name: Rebuild and upload feed.xml
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: harvestchurch-sermons
          R2_PUBLIC_BASE_URL: https://hrvstpdcst.com
        run: python migrate_subsplash_feed.py --fix-existing-blurbs

      - name: Commit feed rebuild
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git add feed_items.json
          git diff --staged --quiet || git commit -m "Rebuild feed.xml after blurb batch"

      - name: Push everything committed so far
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git fetch origin main
          git rebase origin/main
          git push
